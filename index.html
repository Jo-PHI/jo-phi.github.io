<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jo Esterly — PHI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Marcellus&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4ecdf;
      --paper-deep: #efe6d6;
      --ink: #2a2520;
      --ink-soft: #4a4239;
      --gold: #a07c3a;
      --gold-muted: #b89669;
      --dark: #1f1a14;
      --dark-text: #c8b591;
      --dark-gold: #b89669;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    section {
      width: 100%;
      position: relative;
    }

    /* Marcellus for capital text */
    .caps {
      font-family: 'Marcellus', 'Cormorant Garamond', serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--gold);
    }

    .caps-muted {
      font-family: 'Marcellus', 'Cormorant Garamond', serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--gold-muted);
    }

    .name { font-size: 0.95rem; }
    .section-header { font-size: 0.9rem; }

    .footer-credit {
      font-family: 'Marcellus', serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 0.7rem;
      line-height: 2.0;
      text-align: center;
      color: var(--dark-gold);
      opacity: 0.78;
    }

    .divider {
      width: 2.5rem;
      height: 1px;
      background: var(--gold);
      border: none;
      margin: 2rem auto;
    }

    .divider-dark {
      background: var(--dark-gold);
      opacity: 0.5;
    }

    .signature {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.7rem, 3.6vw, 2.8rem);
      line-height: 1.4;
      color: var(--ink);
      max-width: 32ch;
      text-align: center;
      margin: 0 auto;
    }

    /* ---------- Section 1 — Identity (two-zone split) ---------- */
    .identity {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .identity-top {
      background: var(--paper);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem 3rem;
    }

    .identity-top .name {
      margin-bottom: 3.5rem;
    }

    .identity-bottom {
      background: var(--dark);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem 4rem;
    }

    .contact {
      font-family: 'Marcellus', serif;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 0.85rem;
      color: var(--dark-gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.2rem;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .contact:hover {
      color: var(--paper);
      border-bottom-color: var(--paper);
    }

    .identity-bottom .footer-credit {
      margin-top: 2.5rem;
    }

    /* ---------- Section 2 — Currently Writing ---------- */
    .writing {
      background: var(--paper-deep);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem;
    }

    .writing-inner {
      max-width: 36rem;
      width: 100%;
      text-align: center;
    }

    .projects {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    .project-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 1.5rem;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .project-desc {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.2rem;
      color: var(--ink-soft);
      line-height: 1.5;
      max-width: 30ch;
      margin: 0 auto;
    }

    .project-link {
      display: block;
      margin-top: 0.9rem;
      font-family: 'Marcellus', serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 0.72rem;
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .project-link:hover {
      border-bottom-color: var(--gold);
    }

    @media (max-width: 600px) {
      .identity-top { padding: 4rem 1.5rem 2.5rem; }
      .identity-top .name { margin-bottom: 2.5rem; }
      .identity-bottom { padding: 2.5rem 1.5rem 3rem; }
      .writing { padding: 4rem 1.5rem; }
      .projects { gap: 2.5rem; }
    }
  </style>
</head>
<body>

  <!-- Section 1 — Identity (two-zone split) -->
  <section class="identity">

    <div class="identity-top">
      <div class="caps name">Jo Esterly</div>
      <p class="signature">I write about the way we push against the world.</p>
    </div>

    <div class="identity-bottom">
      <a class="contact" href="mailto:phi@joesterly.com">phi@joesterly.com</a>
      <div class="footer-credit">
        PHI &nbsp;•&nbsp; Portraits of Human Intelligence<br>
        © 2026, Jo Esterly
      </div>
    </div>

  </section>

  <!-- Section 2 — Currently Writing -->
  <section class="writing">
    <div class="writing-inner">
      <div class="caps section-header">Currently Writing</div>
      <hr class="divider">

      <div class="projects">
        <div class="project">
          <div class="project-name">Portraits</div>
          <p class="project-desc">of refusing to be flattened.</p>
        </div>

        <div class="project">
          <div class="project-name">Intangible Assets</div>
          <p class="project-desc">what systems see, and what they miss.</p>
          <a class="project-link" href="https://github.com/Jo-PHI" target="_blank" rel="noopener">notes at github</a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
